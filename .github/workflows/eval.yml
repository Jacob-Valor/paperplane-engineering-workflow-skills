name: eval

# Agent scenarios and the triggering test through `claude -p` (tests/eval/run.py), and the
# tool-using sandbox eval (tests/eval/sandbox/run.py). Needs the ANTHROPIC_API_KEY secret.
# Pull requests that touch a SKILL.md run only the triggering test (cheap); without the key they
# skip with a warning, since forks never get secrets. The weekly run and manual runs do every
# scenario on haiku, graded by opus, plus the sandbox with and without the hooks; without the key
# they fail, so a missing key can't look like a passing eval.
on:
  pull_request:
    paths: ["skills/*/SKILL.md"]
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC, after the drift check
  workflow_dispatch:
    inputs:
      model:
        description: "answer model (haiku, sonnet, opus)"
        default: haiku
      scenarios:
        description: "comma-separated ids or 'all'"
        default: all
      reps:
        description: "runs per scenario"
        default: "3"

permissions:
  contents: read

# The group includes the event name, so a manual dispatch never queues behind or cancels the
# weekly run. Only superseded pull request pushes are cancelled; scheduled and dispatched runs
# are never cancelled by a newer one (they cost real money and their results are the record).
concurrency:
  group: eval-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eval:
    name: skills hold up in agent runs
    runs-on: ubuntu-latest
    # Sized from the work, four runs at a time. Pull request: the triggering test only, 3 claude
    # calls, so 20 minutes. Weekly/dispatch defaults: 19 scenarios x 3 reps x 2 calls (answer and
    # grade) = 114 calls, plus 3 triggering calls, plus the sandbox: 9 scenarios x 2 enforcement
    # modes x 2 reps = 36 runs. At 1-3 minutes a call and 3-5 minutes a sandbox run that is about
    # 1-1.5 hours. 180 minutes leaves room for slow runs without letting a hang burn the 6-hour
    # default; raise it if you dispatch with more reps or a bigger model.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 180 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The API key is set only on the steps that need it (this one, the triggering test and the
      # scenarios), never at job level, so the install steps below (curl | bash, npm, the gitleaks
      # download) cannot read it.

      - name: Check the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then exit 0; fi
          echo "ANTHROPIC_API_KEY is not set; add it as a repository secret (Settings > Secrets and variables > Actions)." >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "::warning::ANTHROPIC_API_KEY is not set; the triggering test was skipped"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "::error::ANTHROPIC_API_KEY is not set; the eval cannot run"
            exit 1
          fi

      - name: Install the claude CLI
        if: steps.key.outputs.skip != '1'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pnpm and gitleaks (sandbox)
        if: steps.key.outputs.skip != '1' && github.event_name != 'pull_request'
        run: |
          npm install -g pnpm@9
          V=8.30.1
          dir=$(mktemp -d)
          base="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          curl -sSfL -o "$dir/gitleaks_${V}_linux_x64.tar.gz" "$base/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o "$dir/gitleaks_${V}_checksums.txt" "$base/gitleaks_${V}_checksums.txt"
          (cd "$dir" && sha256sum -c --ignore-missing "gitleaks_${V}_checksums.txt")
          sudo tar -xzf "$dir/gitleaks_${V}_linux_x64.tar.gz" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Triggering test
        if: steps.key.outputs.skip != '1' && github.event_name == 'pull_request'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tests/eval/run.py --trigger --reps 3 --model haiku --out eval-out

      - name: Scenarios
        if: steps.key.outputs.skip != '1' && github.event_name != 'pull_request'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ inputs.model || 'haiku' }}
          SCENARIOS: ${{ inputs.scenarios || 'all' }}
          REPS: ${{ inputs.reps || '3' }}
        run: |
          python3 tests/eval/run.py --scenarios "$SCENARIOS" --reps "$REPS" --model "$MODEL" \
            --judge-model opus --jobs 4 --out eval-out || status=$?
          python3 tests/eval/run.py --trigger --reps 3 --model "$MODEL" --out eval-out || status=$?
          git config --global user.name "eval bot"; git config --global user.email "eval@example.com"
          python3 tests/eval/sandbox/run.py --reps 2 --model "$MODEL" --enforcement both --jobs 4 --out eval-out || status=$?
          exit "${status:-0}"

      - name: Summary
        if: always() && steps.key.outputs.skip != '1'
        run: cat eval-out/*/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.key.outputs.skip != '1'
        with:
          name: eval-out
          path: eval-out/
          if-no-files-found: ignore
