name: eval

# Agent scenarios and the triggering test through `claude -p` (tests/eval/run.py), and the
# tool-using sandbox eval (tests/eval/sandbox/run.py). Needs the ANTHROPIC_API_KEY secret.
# Pull requests that touch a SKILL.md run only the triggering test (cheap); without the key they
# skip with a warning, since forks never get secrets. The weekly run and manual runs do every
# scenario on haiku, graded by opus, plus the sandbox with and without the hooks; without the key
# they fail, so a missing key can't look like a passing eval.
on:
  pull_request:
    paths: ["skills/*/SKILL.md"]
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC, after the drift check
  workflow_dispatch:
    inputs:
      model:
        description: "answer model (haiku, sonnet, opus)"
        default: haiku
      scenarios:
        description: "comma-separated ids or 'all'"
        default: all
      reps:
        description: "runs per scenario"
        default: "3"

permissions:
  contents: read

concurrency:
  group: eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: skills hold up in agent runs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the API key
        id: key
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then exit 0; fi
          echo "ANTHROPIC_API_KEY is not set; add it as a repository secret (Settings > Secrets and variables > Actions)." >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "::warning::ANTHROPIC_API_KEY is not set; the triggering test was skipped"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "::error::ANTHROPIC_API_KEY is not set; the eval cannot run"
            exit 1
          fi

      - name: Install the claude CLI
        if: steps.key.outputs.skip != '1'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pnpm and gitleaks (sandbox)
        if: steps.key.outputs.skip != '1' && github.event_name != 'pull_request'
        run: |
          npm install -g pnpm@9
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Triggering test
        if: steps.key.outputs.skip != '1' && github.event_name == 'pull_request'
        run: python3 tests/eval/run.py --trigger --reps 3 --model haiku --out eval-out

      - name: Scenarios
        if: steps.key.outputs.skip != '1' && github.event_name != 'pull_request'
        env:
          MODEL: ${{ inputs.model || 'haiku' }}
          SCENARIOS: ${{ inputs.scenarios || 'all' }}
          REPS: ${{ inputs.reps || '3' }}
        run: |
          python3 tests/eval/run.py --scenarios "$SCENARIOS" --reps "$REPS" --model "$MODEL" \
            --judge-model opus --jobs 4 --out eval-out || status=$?
          python3 tests/eval/run.py --trigger --reps 3 --model "$MODEL" --out eval-out || status=$?
          git config --global user.name "eval bot"; git config --global user.email "eval@example.com"
          python3 tests/eval/sandbox/run.py --reps 2 --model "$MODEL" --enforcement both --jobs 4 --out eval-out || status=$?
          exit "${status:-0}"

      - name: Summary
        if: always() && steps.key.outputs.skip != '1'
        run: cat eval-out/*/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.skip != '1'
        with:
          name: eval-out
          path: eval-out/
          if-no-files-found: ignore
