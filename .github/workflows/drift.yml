name: drift

# The live drift check reads paperplanehq/paperplane-engineering with the ORG_READ_TOKEN secret, so
# it runs only on the schedule and on manual dispatch, never on pull_request: a pull request can
# edit tests/drift/check.sh and print the token. The offline half (tests/scripts/test-drift.sh, a
# fake gh) already runs on every pull request in validate.yml, so there is no PR trigger here and
# no PR run that could pass without having checked anything. Pins and how to refresh them:
# docs/ci-pins.md.
on:
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: skills match the engineering guide
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Explain the token
        run: |
          echo "Drift check reads paperplanehq/paperplane-engineering with the ORG_READ_TOKEN secret: a fine-grained PAT with read-only Contents on paperplanehq/paperplane-engineering. It runs only on the schedule and on manual dispatch (never on pull requests: a pull request could read the secret). A missing, expired or revoked token fails the run. Failed scheduled runs open or update an issue labelled drift." >> "$GITHUB_STEP_SUMMARY"
      - name: Compare skills with the guide
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: bash tests/drift/check.sh

  notify:
    name: open or update an issue when the scheduled run fails
    needs: drift
    if: ${{ always() && needs.drift.result == 'failure' && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or comment on the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create drift --description "drift check failed" --color D93F0B 2>/dev/null || true
          body="The scheduled drift check failed: $RUN_URL. Either the skills drifted from the engineering guide or ORG_READ_TOKEN expired or lost access (see the step summary)."
          number=$(gh issue list --label drift --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --label drift --title "drift check is failing" --body "$body"
          fi
