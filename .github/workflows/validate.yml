name: validate

on:
  # No path filter on purpose: pull requests run this for every change (skills, scripts, hooks,
  # tests and the workflows themselves), so a change to any of them is always validated.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The gitleaks pin (version and per-platform SHA-256) lives here once and both jobs read it.
# Dependabot cannot update it: see docs/ci-pins.md for how to refresh it. Hashes come from
# https://github.com/gitleaks/gitleaks/releases/download/v<version>/gitleaks_<version>_checksums.txt
env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256_LINUX_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  GITLEAKS_SHA256_DARWIN_ARM64: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
  GITLEAKS_SHA256_DARWIN_X64: dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709

jobs:
  skills:
    name: skills are valid and scripts work
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # the secret scan below reads every commit

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 runs the omp adapter tests in test-hooks.sh

      - name: Validate every skill against the Agent Skills spec
        # Pinned to a commit of agentskills/agentskills (main on 2026-08-09) so CI cannot change under us.
        run: |
          for s in skills/*/SKILL.md; do
            uvx --from "git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref" skills-ref validate "$(dirname "$s")"
          done

      - name: Lint scripts and hooks
        run: |
          shellcheck -S warning skills/*/scripts/*.sh skills/*/hooks/*.sh skills/paperplane-shipping-changes/hooks/git-pre-push \
            tests/scripts/*.sh tests/drift/*.sh
          python3 -m py_compile tests/eval/run.py tests/eval/checks.py
          python3 tests/eval/checks.py --self-test
          python3 tests/eval/label.py --self-test
          python3 tests/eval/run.py --self-test

      - name: README version matches the newest CHANGELOG entry
        run: |
          want=$(grep -m1 -oE '^## v[0-9.]+' CHANGELOG.md | cut -c4-)
          got=$(grep -m1 -oE 'Version \*\*v[0-9.]+\*\*' README.md | grep -oE 'v[0-9.]+')
          [ "$want" = "$got" ] || { echo "::error::README says $got, CHANGELOG's newest entry is $want"; exit 1; }
          echo "version $got"

      - name: Install gitleaks
        run: |
          V=$GITLEAKS_VERSION
          dir=$(mktemp -d)
          base="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          curl -sSfL -o "$dir/gitleaks_${V}_linux_x64.tar.gz" "$base/gitleaks_${V}_linux_x64.tar.gz"
          # the expected hash is pinned in the workflow env: a checksums file from the same release page proves nothing
          echo "$GITLEAKS_SHA256_LINUX_X64  $dir/gitleaks_${V}_linux_x64.tar.gz" | sha256sum -c -
          sudo tar -xzf "$dir/gitleaks_${V}_linux_x64.tar.gz" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Secret scan of this repo (working tree and every commit)
        run: |
          gitleaks dir --no-banner --redact .
          gitleaks git --no-banner --redact .

      - name: Test skill scripts
        run: |
          git config --global init.defaultBranch develop
          bash tests/scripts/run.sh

      - name: Sandbox eval self-check (no model calls)
        run: |
          python3 -m py_compile tests/eval/sandbox/run.py
          python3 tests/eval/sandbox/run.py --self-check

  macos:
    name: scripts work on macOS (bash 3.2, BSD tools)
    runs-on: macos-latest
    timeout-minutes: 20 # a hung test must fail the job, not run for hours
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Syntax-check every script with the system bash
        run: |
          /bin/bash --version | head -1
          for f in skills/*/scripts/*.sh skills/*/hooks/*.sh skills/paperplane-shipping-changes/hooks/git-pre-push \
                   tests/scripts/*.sh tests/drift/*.sh; do
            /bin/bash -n "$f" || { echo "::error file=$f::bash -n failed"; exit 1; }
          done

      - name: Install gitleaks
        run: |
          V=$GITLEAKS_VERSION
          case "$(uname -m)" in
            arm64) arch=arm64; want=$GITLEAKS_SHA256_DARWIN_ARM64 ;;
            x86_64) arch=x64; want=$GITLEAKS_SHA256_DARWIN_X64 ;;
            *) echo "::error::unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          dir=$(mktemp -d)
          file="gitleaks_${V}_darwin_${arch}.tar.gz"
          curl -sSfL -o "$dir/$file" "https://github.com/gitleaks/gitleaks/releases/download/v${V}/$file"
          # the expected hash is pinned in the workflow env, as on Linux; macOS has shasum, not sha256sum
          echo "$want  $dir/$file" | shasum -a 256 -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$dir/$file" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version

      - name: Test skill scripts
        run: |
          git config --global init.defaultBranch develop
          bash tests/scripts/run.sh
